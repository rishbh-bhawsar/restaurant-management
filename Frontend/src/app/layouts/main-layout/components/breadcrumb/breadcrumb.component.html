<nav aria-label="breadcrumb">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item">
      <a routerLink="/dashboard" class="text-decoration-none text-muted small">
        <i class="bi bi-house-door me-1"></i> Home
      </a>
    </li>
    @for (item of breadcrumbs; track item.url; let isLast = $last) {
      <li class="breadcrumb-item small" [class.active]="isLast" [attr.aria-current]="isLast ? 'page' : null">
        @if (isLast) {
          <span class="fw-semibold text-dark">{{ item.label }}</span>
        } @else {
          <a [routerLink]="item.url" class="text-decoration-none text-muted">{{ item.label }}</a>
        }
      </li>
    }
  </ol>
</nav>
