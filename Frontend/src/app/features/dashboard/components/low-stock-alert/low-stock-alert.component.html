<div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3 px-4 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-exclamation-triangle text-danger"></i>
      <h6 class="mb-0 fw-bold text-dark">Low Stock Warnings</h6>
    </div>
    <a routerLink="/inventory" class="btn btn-sm btn-light rounded-pill px-3 text-primary text-decoration-none small">
      Inventory
    </a>
  </div>

  <div class="list-group list-group-flush">
    @for (item of items; track item.id) {
      <div class="list-group-item px-4 py-3 d-flex align-items-center justify-content-between border-bottom">
        <div>
          <div class="fw-semibold text-dark small">{{ item.itemName }}</div>
          <div class="text-muted x-small">
            Ref: <code>{{ item.itemRef }}</code> | {{ item.category }}
          </div>
        </div>
        <div class="text-end">
          <span class="badge bg-danger-subtle text-danger fw-bold">
            {{ item.currentQuantity }} / {{ item.reorderLevel }} {{ item.unit }}
          </span>
          <div class="x-small text-danger mt-1">Reorder now</div>
        </div>
      </div>
    } @empty {
      <div class="text-center py-4 text-muted small">
        <i class="bi bi-check-circle text-success fs-4 d-block mb-1"></i>
        All stock levels are optimal!
      </div>
    }
  </div>
</div>
