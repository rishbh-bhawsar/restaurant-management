<div
  class="card border-0 shadow-sm rounded-4 h-100 product-card-inner cursor-pointer position-relative overflow-hidden"
  (click)="onCustomize()"
>
  <!-- Product image -->
  <div class="product-img-wrapper position-relative overflow-hidden">
    <img [src]="product.image" [alt]="product.name" class="w-100 h-100 object-fit-cover" loading="lazy" />
    <span class="badge bg-dark bg-opacity-75 position-absolute top-0 end-0 m-2 rounded-pill px-2 py-1 x-small text-uppercase">
      {{ product.category }}
    </span>
    @if (!product.inStock) {
      <div class="out-of-stock-overlay position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center">
        <span class="badge bg-danger rounded-pill px-3 py-1">Sold Out</span>
      </div>
    }
  </div>

  <div class="card-body p-3 d-flex flex-column justify-content-between">
    <div>
      <div class="d-flex align-items-center justify-content-between mb-1">
        <span class="text-muted x-small"><code>{{ product.itemRef }}</code></span>
        <span class="fw-bold text-primary fs-6">{{ product.price | appCurrency }}</span>
      </div>
      <h6 class="fw-bold text-dark mb-1 text-truncate" [title]="product.name">{{ product.name }}</h6>
      <p class="text-muted x-small line-clamp-2 mb-3">{{ product.description }}</p>
    </div>

    <div class="d-flex align-items-center gap-2 pt-2 border-top">
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm rounded-pill flex-grow-1 x-small"
        (click)="onCustomize()"
      >
        <i class="bi bi-sliders me-1"></i> Options
      </button>
      <button
        type="button"
        class="btn btn-primary btn-sm rounded-circle p-2 quick-add-btn d-flex align-items-center justify-content-center shadow-xs"
        [disabled]="!product.inStock"
        (click)="onQuickAdd($event)"
        title="Quick Add to Cart"
      >
        <i class="bi bi-plus-lg fs-6 lh-1"></i>
      </button>
    </div>
  </div>
</div>
