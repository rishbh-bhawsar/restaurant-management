@if (loading) {
  <div class="row g-3">
    @for (s of [1, 2, 3, 4, 5, 6]; track s) {
      <div class="col-12 col-sm-6 col-md-4 col-xl-3">
        <div class="card border-0 rounded-4 p-3 shadow-sm bg-light placeholder-glow">
          <div class="placeholder rounded-3 w-100 mb-3" style="height: 140px;"></div>
          <span class="placeholder col-6 mb-2"></span>
          <span class="placeholder col-8"></span>
        </div>
      </div>
    }
  </div>
} @else if (products.length > 0) {
  <div class="row g-3">
    @for (p of products; track p.id) {
      <div class="col-12 col-sm-6 col-md-4 col-xl-3">
        <app-product-card
          [product]="p"
          (quickAdd)="quickAdd.emit($event)"
          (customize)="customize.emit($event)"
        ></app-product-card>
      </div>
    }
  </div>
} @else {
  <app-empty-state
    title="No Menu Items Found"
    description="No dishes match the selected category or search filter. Try clearing filters."
    icon="bi-search"
    actionText="Reset Search"
    [is404]="true"
    (action)="resetSearch.emit()"
  ></app-empty-state>
}
