<div class="card border-0 shadow-sm rounded-4 p-4 h-100 stat-card-inner">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <span class="text-muted fw-semibold small text-uppercase letter-spacing">{{ label }}</span>
    <div class="stat-icon-wrapper rounded-3" [style.backgroundColor]="iconBg" [style.color]="iconColor">
      <i class="bi" [ngClass]="icon"></i>
    </div>
  </div>
  <div class="d-flex align-items-baseline justify-content-between">
    <h3 class="fw-bold mb-0 text-dark">{{ value }}</h3>
    @if (trend) {
      <span class="badge small" [ngClass]="trendPositive ? 'text-success bg-success-subtle' : 'text-danger bg-danger-subtle'">
        <i class="bi" [ngClass]="trendPositive ? 'bi-arrow-up-short' : 'bi-arrow-down-short'"></i>
        {{ trend }}
      </span>
    }
  </div>
  @if (subtext) {
    <p class="text-muted small mt-2 mb-0">{{ subtext }}</p>
  }
</div>
