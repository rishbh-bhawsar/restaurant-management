<div class="search-box-wrapper position-relative">
  <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
  <input
    type="text"
    class="form-control rounded-pill ps-5 pe-4 py-2 bg-light border-0"
    [placeholder]="placeholder"
    [value]="searchTerm"
    (input)="onInput($event)"
  />
  @if (searchTerm) {
    <button
      type="button"
      class="btn btn-sm btn-link position-absolute top-50 end-0 translate-middle-y me-2 text-muted text-decoration-none"
      (click)="clear()"
    >
      <i class="bi bi-x-circle-fill"></i>
    </button>
  }
</div>
